<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Betano Community</title>
    <style>
        :root { 
            --betano-orange: #f45b22; 
            --orange-gradient: linear-gradient(135deg, #f45b22 0%, #ff8c00 100%);
            --bg-dark: #0a0a0a; 
            --card-bg: #1a1a1a;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-dark); 
            color: #ffffff; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 极简 Header：减少垂直空间占用 */
        header { 
            background: rgba(0, 0, 0, 0.9); 
            padding: 12px 5%; 
            border-bottom: 2px solid var(--betano-orange); 
            text-align: center;
        }
        .logo { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
        .logo span { color: var(--betano-orange); }

        /* 主体布局：自适应高度 */
        .hero { 
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .badge { 
            background: rgba(244, 91, 34, 0.1); 
            color: var(--betano-orange); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 800; 
            margin: 0 auto 15px;
            display: table;
            border: 1px solid rgba(244, 91, 34, 0.3);
        }

        h1 { 
            font-size: 24px; 
            font-weight: 800;
            margin-bottom: 15px; 
            text-align: center;
            line-height: 1.2;
        }
        
        /* 精简内容卡片 */
        .content-card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 18px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* 文案精简：确保三行内说完核心价值 */
        .text-content { 
            color: #b0b0b0; 
            font-size: 15px; 
            text-align: center; 
            margin-bottom: 20px; 
            line-height: 1.5;
        }
        .text-content b { color: #fff; }

        /* 按钮：在 H5 上更宽、更醒目 */
        .btn { 
            display: block; 
            padding: 16px 0; 
            background: var(--orange-gradient); 
            color: #fff; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 18px;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(244, 91, 34, 0.3);
        }

        /* 页脚：极简一行 */
        footer { 
            padding: 15px 20px; 
            font-size: 11px; 
            color: #444; 
            text-align: center; 
        }
    </style>
</head>
<body>

<header><div class="logo"><span>BET</span>ANO COMMUNITY</div></header>

<div class="hero">
    <div class="badge">OFICIAL 2026</div>
    <h1>Sua Elite Gaming</h1>
    
    <div class="content-card">
        <div class="text-content">
            Acesse os <b>melhores jogos</b> e as <b>plataformas mais seguras</b> do Brasil através da nossa curadoria exclusiva.
        </div>
        
        <a href="/join" class="btn">COMEÇAR AGORA</a>
    </div>
</div>

<footer>
    © 2026 Kaizen Gaming. Jogue com responsabilidade (18+).
</footer>

</body>
</html>
